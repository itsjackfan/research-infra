[project]
name = "research-infra"
version = "0.1.0"
description = "Shared launcher, run guard, run dirs, monitoring and sync for research projects"
requires-python = ">=3.10"
dependencies = ["hydra-core", "omegaconf", "wandb", "numpy", "imageio[ffmpeg]", "torch", "nvidia-ml-py"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
